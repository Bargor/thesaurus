name: Android CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  verify-api-31:
    name: Verify (API 31)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Static checks and JVM tests
        run: bash ./gradlew lintDebug testDebugUnitTest --stacktrace
      - name: Set up Node for local Firebase Emulator dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run Firestore Rules tests
        run: |
          npm ci --ignore-scripts
          npm run test:rules
      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          script: npx --no-install firebase emulators:exec --project demo-thesaurus --only auth,firestore "bash ./gradlew connectedDebugAndroidTest --stacktrace"
      - name: Upload APK and test reports
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-api-31-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/

  verify-api-37-daily:
    name: Daily verification (API 37)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Static checks and JVM tests
        run: bash ./gradlew lintDebug testDebugUnitTest --stacktrace
      - name: Set up Node for local Firebase Emulator dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run Firestore Rules tests
        run: |
          npm ci --ignore-scripts
          npm run test:rules
      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37.0
          arch: x86_64
          target: google_apis
          script: npx --no-install firebase emulators:exec --project demo-thesaurus --only auth,firestore "bash ./gradlew connectedDebugAndroidTest --stacktrace"
      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-37-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
