name: Android CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_api_37:
        description: Run API 37 daily verification
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run lint
        run: bash ./gradlew lintDebug --stacktrace --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run unit-tests
        run: bash ./gradlew testDebugUnitTest --stacktrace --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run build-release
        run: bash ./gradlew assembleRelease --stacktrace --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-release-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/

  verify-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run verify-dev
        run: bash ./gradlew assembleDevDebug --stacktrace --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Verify developer tests
        run: bash ./gradlew -PdevTest=true testDevDebugUnitTest compileDevDebugAndroidTestKotlin --stacktrace --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-dev-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/

  build-test-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run build-test-apks
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-apks-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk

  firebase-and-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:variants
      - run: npm run test:project-safety
      - run: npm run test:rules
      - run: npm run test:hosting
      - run: npm run test:ci-assembly
      - run: npm run test:ci-instrumentation
      - run: node --test scripts/test-ci-shard.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firebase-logs
          if-no-files-found: ignore
          path: '*debug.log'

  instrumentation-api31:
    needs: build-test-apks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-apks
          path: test-apks
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation shard
        timeout-minutes: 25
        env:
          ANDROID_SERIAL: emulator-5554
          CI_CAPTURE_VISUAL_EVIDENCE: 'true'
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_NUM_SHARDS: '3'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '31'
          arch: x86_64
          target: google_apis
          script: npx --no-install firebase emulators:exec --project demo-thesaurus-integration --only auth,firestore "bash scripts/ci-instrumentation.sh node scripts/ci-shard.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-31-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            app/build/ci-instrumentation/
            *debug.log

  instrumentation-api37:
    needs: build-test-apks
    if: ${{ github.event_name == 'schedule' || inputs.run_api_37 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
      - name: Prefer current Android command-line tools
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-preinstalled"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-apks
          path: test-apks
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation shard
        timeout-minutes: 25
        env:
          ANDROID_SERIAL: emulator-5554
          CI_CAPTURE_VISUAL_EVIDENCE: 'true'
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_NUM_SHARDS: '3'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          script: npx --no-install firebase emulators:exec --project demo-thesaurus-integration --only auth,firestore "bash scripts/ci-instrumentation.sh node scripts/ci-shard.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-37-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            app/build/ci-instrumentation/
            *debug.log
