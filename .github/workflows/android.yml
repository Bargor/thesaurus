name: Android CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31]
        include:
          - api-level: 37
            scheduled-only: true
    if: matrix.scheduled-only != true || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Static checks and JVM tests
        run: bash ./gradlew lintDebug testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: bash ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload APK and test reports
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
